name: run-tests

permissions:
  contents: read

on:
  push:
    paths:
      - '**.php'
      - '.github/workflows/run-tests.yml'
      - 'phpunit.xml'
      - 'composer.json'
      - 'composer.lock'
      - 'testbench.yaml'
      - 'workbench/**'
  pull_request:
    paths:
      - '**.php'
      - '.github/workflows/run-tests.yml'
      - 'phpunit.xml'
      - 'composer.json'
      - 'composer.lock'
      - 'testbench.yaml'
      - 'workbench/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          # PHP floor is 8.4 — Pest 5 requires PHP ^8.4. Add an '8.5' cell when
          # the package raises its floor or widens its supported range.
          # Laravel 12 / testbench 10 cells are NOT testable with Pest 5:
          # Pest 5 needs symfony/process ^8.1 and testbench 10 pins ^7.2, so the
          # pair cannot install. `require` still allows Laravel 12 for consumers;
          # the suite runs on Laravel 13 only.
          # Floor — lowest supported combo (prefer-lowest)
          - { php: '8.4', laravel: '13.*', testbench: '11.*', stability: prefer-lowest }
          # Ceiling — highest supported combo
          - { php: '8.4', laravel: '13.*', testbench: '11.*', stability: prefer-stable }
          # Newest supported PHP
          - { php: '8.5', laravel: '13.*', testbench: '11.*', stability: prefer-stable }

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.stability }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gmp
          coverage: none

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: Execute tests
        run: vendor/bin/pest --ci
